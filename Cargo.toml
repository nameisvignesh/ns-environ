[package]
name = "environ"
version = "0.3.0"
edition = "2024"
description = "A focused, Rust-native desktop code editor."
license = "MIT"
authors = ["Vignesh"]

[dependencies]
eframe = "0.33"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

